[project]
name = "staid"
version = "0.1.0"
description = "STAID: iterative deconvolution in spatial transcriptomics via deep learning and graph Fourier Transform"
readme = "README.md"
license = {text = "MIT"}
authors = [
  { name = "Jixin Liu", email = "frankliu210@163.com" }
]
requires-python = ">=3.8"
dependencies = [
    "pandas==1.5.3",
    "scipy==1.9.0",
    "scikit-learn==1.5.1",
    "numba==0.60.0",
    "plotnine==0.9.0",
    "networkx==3.2.1",
    "igraph==0.11.6",
    "leidenalg==0.10.2",
    "louvain==0.8.2",
    "scanpy==1.9.2",
    "anndata==0.10.0",
    "gseapy==1.1.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]

[project.urls]
Homepage = "https://github.com/jxLiu-bio/STAID"
Documentation = "https://github.com/jxLiu-bio/STAID/wiki"


[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]